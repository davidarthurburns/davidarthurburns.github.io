<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deflect</title>
<style>
:root{--bg:#f2f3f5;--fg:#1b1d22;--muted:#5d6370;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaee;--muted:#9aa1ae}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaee;--muted:#9aa1ae}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
h1{font-size:18px;margin:0;font-weight:600}
canvas{width:100%;max-width:900px;height:auto;aspect-ratio:3/2;border-radius:10px;display:block;background:#0e1014}
p{margin:0;color:var(--muted);font-size:14px;text-align:center}
kbd{font-family:ui-monospace,monospace;border:1px solid var(--muted);border-radius:4px;padding:0 5px}
#wrap{width:100%;max-width:900px}
#wrap:fullscreen,#wrap.pfs{max-width:none;display:flex;align-items:center;justify-content:center;background:#000}
#wrap.pfs{position:fixed;inset:0;z-index:99}
#wrap:fullscreen canvas,#wrap.pfs canvas{width:min(100vw,150vh);max-width:none;border-radius:0}
button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<h1>Deflect</h1>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="fs" type="button">⛶ Fullscreen (F)</button>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>←</kbd><kbd>→</kbd> swing the stick (it can’t pass behind you) · <kbd>Space</kbd> restart · <kbd>F</kbd> fullscreen<br>Touch a boss’s body with your stick to defeat it (every fifth boss is a giant with a health bar). Its sword can be deflected, but not let near your circle.</p>
<script>
const W=900,H=600,R0=16,BASEL=52,T=3,GAP=.7,LIM=Math.PI-GAP/2,FACE=-Math.PI/2;
let R=R0; // current player radius (shrinks with the Shrink power-up)
const PM=10,INERTIA=12000,REST=.8,MAXV=1100;
const TYPES=[{n:"Longer stick",c:"#78e696"},{n:"Faster swing",c:"#ffd166"},{n:"Faster circle",c:"#6fd3ff"},{n:"Heavier sword",c:"#ff8fa3"},{n:"Shield",c:"#c3a6ff"},{n:"Shrink",c:"#ffa94d"},{n:"Heal",c:"#ff4d6d"},{n:"Max health",c:"#ff2d55"}];
const PAL_P={suit:"#eef1f7",trim:"#9aa4b8",dark:"#59627a",visor:"#2a5bff",glow:"#5ee7ff"};
const PAL_B={suit:"#2b2433",trim:"#7a1f2e",dark:"#120d16",visor:"#ff2a2a",glow:"#ff5c5c"};
const DURS=[15,15,15,15,20,12];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const wr=a=>Math.atan2(Math.sin(a),Math.cos(a));
const keys={};
function toggleFS(){
  const w=document.getElementById("wrap");
  if(document.fullscreenElement){document.exitFullscreen();return;}
  if(w.classList.contains("pfs")){w.classList.remove("pfs");return;}
  const p=w.requestFullscreen?w.requestFullscreen():Promise.reject();
  Promise.resolve(p).catch(()=>w.classList.add("pfs")); // fallback: fill the window
}
document.getElementById("fs").onclick=function(){toggleFS();this.blur();};
function devJump(n){
  if(over)reset();
  level=Math.max(1,n);boss=null;enemies=[];spawnT=1.5;P.hp=P.maxhp;nextBoss=score+10+3*level;
  banner=2.5;bannerTxt="LEVEL "+level;bannerSub="Dev jump";
}
let dev=false,devBuf="",devT=0;
addEventListener("keydown",e=>{
  if(e.code==="KeyF"){toggleFS();return;}
  if(e.code==="Escape")document.getElementById("wrap").classList.remove("pfs");
  if(e.code==="Backquote"){dev=!dev;devBuf="";return;}
  if(dev){
    if(/^[0-9]$/.test(e.key)){devBuf=(devBuf+e.key).slice(0,3);devT=performance.now();}
    else if(e.code==="Enter"&&devBuf){devJump(parseInt(devBuf,10));devBuf="";}
    else if(e.code==="KeyB"&&!boss&&!over)spawnBoss();
  }
  keys[e.code]=true;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();if(e.code==="Space"&&over)reset();});
addEventListener("keyup",e=>{keys[e.code]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;});

let P,ups,pickups,enemies,parts,boss,level,nextBoss,banner,bannerTxt,bannerSub,bgHue=210,score,t,spawnT,over,best=0,cnt=[0,0,0,0,0,0],pops=[];
function reset(){
  R=R0;P={x:W/2,y:H/2,vx:0,vy:0,th:0,om:0,r:R,L:BASEL,im:1/PM,ii:1/INERTIA,inv:0,hp:3,maxhp:3};
  cnt=[0,0,0,0,0,0];pickups=[];enemies=[];parts=[];pops=[];boss=null;level=1;nextBoss=10;banner=0;bannerSub="";bgHue=210;
  score=0;t=0;spawnT=1;over=false;
}
reset();

/* ---------- physics helpers ---------- */
// Impulse between two rigid bodies (x,y,vx,vy,om,im,ii) at contact (cx,cy); n points from A to B. Returns impulse magnitude.
function impulse(A,B,cx,cy,nx,ny,rest){
  const rax=cx-A.x,ray=cy-A.y,rbx=cx-B.x,rby=cy-B.y;
  const vn=((B.vx-B.om*rby)-(A.vx-A.om*ray))*nx+((B.vy+B.om*rbx)-(A.vy+A.om*rax))*ny;
  if(vn>=0)return 0;
  const ca=rax*ny-ray*nx,cb=rbx*ny-rby*nx;
  const j=-(1+rest)*vn/(A.im+B.im+ca*ca*A.ii+cb*cb*B.ii);
  A.vx-=j*nx*A.im;A.vy-=j*ny*A.im;A.om-=j*ca*A.ii;
  B.vx+=j*nx*B.im;B.vy+=j*ny*B.im;B.om+=j*cb*B.ii;
  return j;
}
function segPoint(ax,ay,bx,by,px,py){
  const ux=bx-ax,uy=by-ay,s=cl(((px-ax)*ux+(py-ay)*uy)/(ux*ux+uy*uy),0,1);
  const cx=ax+ux*s,cy=ay+uy*s;return [Math.hypot(px-cx,py-cy),cx,cy];
}
function segSeg(ax,ay,bx,by,cx,cy,dx,dy){
  const ux=bx-ax,uy=by-ay,vx=dx-cx,vy=dy-cy,wx=ax-cx,wy=ay-cy;
  const a=ux*ux+uy*uy,b=ux*vx+uy*vy,c=vx*vx+vy*vy,d=ux*wx+uy*wy,e=vx*wx+vy*wy,D=a*c-b*b;
  let s=D>1e-9?cl((b*e-c*d)/D,0,1):0,u=(b*s+e)/c;
  if(u<0){u=0;s=cl(-d/a,0,1)}else if(u>1){u=1;s=cl((b-d)/a,0,1)}
  return [ax+ux*s,ay+uy*s,cx+vx*u,cy+vy*u];
}
function walls(F){
  if(F.x<F.r){F.x=F.r;F.vx=Math.abs(F.vx)*.4}
  if(F.x>W-F.r){F.x=W-F.r;F.vx=-Math.abs(F.vx)*.4}
  if(F.y<F.r){F.y=F.r;F.vy=Math.abs(F.vy)*.4}
  if(F.y>H-F.r){F.y=H-F.r;F.vy=-Math.abs(F.vy)*.4}
}
function burst(x,y,n,col,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.4,col});}
}
function drop(x,y,vx,vy){
  let ty;
  if(Math.random()<.04)ty=7; // rare: permanent extra heart
  else{
    const w=[2,2,2,2,1.5,2,P.hp>=P.maxhp?0:P.hp<=1?9:2]; // heals are far more common at 1 HP
    let r=Math.random()*w.reduce((a,b)=>a+b),i=0;
    while(i<6&&r>=w[i]){r-=w[i];i++}
    ty=i;
  }
  pickups.push({x,y,vx,vy,age:0,life:10,type:ty});
}
function hurt(){
  if(over||P.inv>0)return;
  if(cnt[4]>0){cnt[4]--;P.inv=1;burst(P.x,P.y,30,"#c3a6ff",260);return;}
  P.hp--;P.inv=1.2;
  if(P.hp<=0){over=true;best=Math.max(best,score);burst(P.x,P.y,60,"#6fd3ff",300);}
  else burst(P.x,P.y,24,"#ff4d4d",240);
}

/* ---------- enemies ---------- */
function spawn(){
  const side=Math.floor(Math.random()*4),m=30;let x,y;
  if(side===0){x=Math.random()*W;y=-m}else if(side===1){x=W+m;y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}
  const tx=P.x+(Math.random()-.5)*160,ty=P.y+(Math.random()-.5)*160;
  const d=Math.hypot(tx-x,ty-y),sp=(110+Math.min(t*2,120)+Math.random()*50)*(1+.08*(level-1)),r=9+Math.random()*9,m2=1.5*(r/10)**2;
  enemies.push({x,y,vx:(tx-x)/d*sp,vy:(ty-y)/d*sp,om:0,ii:0,im:1/m2,r,hit:false,
    type:Math.floor(Math.random()*3),rot:0,spin:(Math.random()-.5)*2,
    hue:[95,130,160,190,285,50][Math.floor(Math.random()*6)],eyes:1+Math.floor(Math.random()*3),ant:Math.floor(Math.random()*3)});
}
function stickVsCircle(F,a,e,isP){
  const dx=Math.cos(a),dy=Math.sin(a),ax0=F.x+dx*F.r,ay0=F.y+dy*F.r;
  const s=cl((e.x-ax0)*dx+(e.y-ay0)*dy,0,F.L),cx=ax0+dx*s,cy=ay0+dy*s;
  let nx=e.x-cx,ny=e.y-cy,d=Math.hypot(nx,ny);
  if(d>=e.r+T)return;
  if(d<1e-6){nx=-dy;ny=dx;d=1}
  nx/=d;ny/=d;e.x=cx+nx*(e.r+T);e.y=cy+ny*(e.r+T);
  const j=impulse(F,e,cx,cy,nx,ny,REST);
  if(j>0){
    const sp=Math.hypot(e.vx,e.vy);if(sp>MAXV){e.vx*=MAXV/sp;e.vy*=MAXV/sp}
    e.spin=(e.vx*ny-e.vy*nx)/e.r*.1;
    if(isP){if(!e.hit&&Math.random()<(P.hp<=1?.45:.3))drop(e.x,e.y,e.vx*.15,e.vy*.15);e.hit=true;}
    burst(cx,cy,Math.min(14,4+j*.4),isP?"#ffc857":"#ff8a6b",120+Math.min(j,40)*4);
  }
}

/* ---------- boss ---------- */
function spawnBoss(){
  // every fifth level ends with a giant boss that has a health bar
  const left=P.x>W/2,big=level%5===0,hp=big?8+2*(level/5-1):1;
  boss={x:left?70:W-70,y:H/2,vx:0,vy:0,th:left?0:Math.PI,om:0,r:big?34:18,L:big?85:50,im:big?1/40:1/12,ii:1/(INERTIA*(big?4:1.2)),
    time:0,lv:level-1,hp,maxhp:hp,cool:0,mode:"sweep",mt:2,dir:1,dashed:false,big};
  banner=2.2;bannerTxt=big?"GIANT BOSS":"BOSS INCOMING";bannerSub=big?"Level "+level+" · land "+hp+" hits":"";
}
function bossAI(b,dt){
  b.time+=dt;b.cool=Math.max(0,b.cool-dt);b.mt-=dt;
  const lv=b.lv;
  // pick a new attack pattern; higher levels unlock harder ones
  if(b.mt<=0){
    const modes=["sweep","lunge","spin","flurry"].slice(0,Math.min(4,1+lv));
    b.mode=modes[Math.floor(Math.random()*modes.length)];b.dir=Math.random()<.5?1:-1;b.dashed=false;
    b.mt={sweep:3,lunge:1.4,spin:1.8,flurry:2.2}[b.mode]/(1+.04*lv);
  }
  const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,base=Math.atan2(dy,dx);
  const sp=(1+.12*lv)*(b.big?1.2:1);
  let k=cl((d-(b.r+b.L+12))/50,-1,1),orb=260*Math.sin(b.time*.8),ang=base,pd=true;
  if(b.mode==="sweep")ang=base+1.5*Math.sin(b.time*(3+.3*lv));
  else if(b.mode==="flurry")ang=base+2*Math.sin(b.time*(6+.4*lv));
  else if(b.mode==="lunge"){ // cock the sword back, then dash and slash across
    const ph=cl((.7-b.mt)/.35,0,1);
    if(b.mt>.7){k=-.5;orb=0}
    else{k=0;orb=0;if(!b.dashed){b.dashed=true;b.vx+=nx*(900+80*lv);b.vy+=ny*(900+80*lv);}}
    ang=base+b.dir*(2.2-3.6*ph);
  }else if(b.mode==="spin"){pd=false;b.om+=b.dir*70*dt;}
  b.vx+=(nx*k*650-ny*orb)*sp*dt;b.vy+=(ny*k*650+nx*orb)*sp*dt;
  const f=Math.exp(-3*dt);b.vx*=f;b.vy*=f;b.x+=b.vx*dt;b.y+=b.vy*dt;walls(b);
  // sword: swing back and forth across the direction of the player
  if(pd)b.om+=cl(90*wr(ang-b.th)-7*b.om,-70,70)*(1+.05*lv)*dt;
  b.om*=Math.exp(-1.5*dt);
  const lim=b.mode==="spin"?Math.min(15,7+1.2*lv)*(b.big?.6:1):14;
  b.om=cl(b.om,-lim,lim);b.th+=b.om*dt;
}
function bossDefeated(){
  const big=boss.big;
  burst(boss.x,boss.y,big?160:70,"#ff5c5c",big?420:320);
  drop(boss.x-20,boss.y,-60,0);drop(boss.x+20,boss.y,60,0);
  if(big){drop(boss.x,boss.y-20,0,-60);drop(boss.x,boss.y+20,0,60);}
  score+=big?15:5;level++;nextBoss=score+10+3*level;boss=null;
  enemies=[];spawnT=2.5;P.hp=P.maxhp;
  banner=3;bannerTxt="LEVEL "+level;bannerSub=(big?"Giant boss down +15":"Boss down +5")+" · it gets harder";
}

/* ---------- simulation ---------- */
function step(dt){
  P.inv=Math.max(0,P.inv-dt);
  R+=(R0*Math.max(.5,Math.pow(.94,cnt[5]))-R)*(1-Math.exp(-8*dt));P.r=R;

  // circle movement (facing is locked upward)
  const ax=(keys.KeyD?1:0)-(keys.KeyA?1:0),ay=(keys.KeyS?1:0)-(keys.KeyW?1:0),acc=1200*(1+.05*cnt[2]);
  P.vx+=ax*acc*dt;P.vy+=ay*acc*dt;
  const f=Math.exp(-3.5*dt);P.vx*=f;P.vy*=f;P.x+=P.vx*dt;P.y+=P.vy*dt;walls(P);

  // stick: angular momentum, limited to one arc that excludes the wedge behind the player
  const sw=1+.05*cnt[1];
  P.L+=(BASEL+6*cnt[0]-P.L)*(1-Math.exp(-8*dt));
  P.ii=1/(INERTIA*Math.pow(P.L/BASEL,1.5)*(1+.12*cnt[3]));
  const tq=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
  P.om+=tq*55*sw*dt;P.om*=Math.exp(-4*dt);P.om=cl(P.om,-16*sw,16*sw);
  P.th+=P.om*dt;
  if(P.th>LIM){P.th=LIM;if(P.om>0)P.om*=-.3}else if(P.th<-LIM){P.th=-LIM;if(P.om<0)P.om*=-.3}
  const pa=FACE+P.th,pdx=Math.cos(pa),pdy=Math.sin(pa);
  const p0x=P.x+pdx*R,p0y=P.y+pdy*R,p1x=P.x+pdx*(R+P.L),p1y=P.y+pdy*(R+P.L);

  if(boss){
    bossAI(boss,dt);
    const b=boss,bdx=Math.cos(b.th),bdy=Math.sin(b.th);
    const b0x=b.x+bdx*b.r,b0y=b.y+bdy*b.r,b1x=b.x+bdx*(b.r+b.L),b1y=b.y+bdy*(b.r+b.L);
    // body vs body: just a shove
    let nx=b.x-P.x,ny=b.y-P.y,d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
    if(d<R+b.r){const ov=(R+b.r-d)/2;P.x-=nx*ov;P.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;impulse(P,b,P.x+nx*R,P.y+ny*R,nx,ny,.5);}
    const hs=segPoint(p0x,p0y,p1x,p1y,b.x,b.y);
    if(!over&&hs[0]<b.r+T){
      let hx=b.x-hs[1],hy=b.y-hs[2];const hd=Math.hypot(hx,hy)||1;hx/=hd;hy/=hd;
      if(b.cool<=0){
        b.hp--;b.cool=.7;burst(hs[1],hs[2],16,"#ffffff",220);
        if(b.hp<=0)bossDefeated();else impulse(P,b,hs[1],hs[2],hx,hy,.6);
      }else impulse(P,b,hs[1],hs[2],hx,hy,.6);
    }else if(!over){
      if(segPoint(b0x,b0y,b1x,b1y,P.x,P.y)[0]<R+T)hurt();
      const [sx,sy,qx,qy]=segSeg(p0x,p0y,p1x,p1y,b0x,b0y,b1x,b1y),dd=Math.hypot(qx-sx,qy-sy);
      if(dd<2*T){
        let mx=qx-sx,my=qy-sy;if(dd<1e-6){mx=-pdy;my=pdx}else{mx/=dd;my/=dd}
        const j=impulse(P,b,(sx+qx)/2,(sy+qy)/2,mx,my,.7);
        if(j>0)burst((sx+qx)/2,(sy+qy)/2,8,"#ffffff",160);
      }
    }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.spin*dt;
    if(e.x<-90||e.x>W+90||e.y<-90||e.y>H+90){if(e.hit)score++;enemies.splice(i,1);continue;}
    const d=Math.hypot(e.x-P.x,e.y-P.y)||1;
    if(!over&&d<R+e.r){
      hurt();
      if(!over){const nx=(e.x-P.x)/d,ny=(e.y-P.y)/d;e.x=P.x+nx*(R+e.r+1);e.y=P.y+ny*(R+e.r+1);e.vx=nx*320;e.vy=ny*320;}
    }
    stickVsCircle(P,pa,e,true);
    if(boss){
      stickVsCircle(boss,boss.th,e,false);
      let nx=e.x-boss.x,ny=e.y-boss.y,bd=Math.hypot(nx,ny)||1;
      if(bd<boss.r+e.r){nx/=bd;ny/=bd;e.x=boss.x+nx*(boss.r+e.r);e.y=boss.y+ny*(boss.r+e.r);impulse(boss,e,boss.x+nx*boss.r,boss.y+ny*boss.r,nx,ny,.8);}
    }
  }
  for(let i=0;i<enemies.length;i++)for(let k=i+1;k<enemies.length;k++){
    const a=enemies[i],b=enemies[k];
    let nx=b.x-a.x,ny=b.y-a.y;const d=Math.hypot(nx,ny),min=a.r+b.r;
    if(d<min&&d>0){nx/=d;ny/=d;const ov=(min-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const j=impulse(a,b,a.x+nx*a.r,a.y+ny*a.r,nx,ny,.9);
      // bonus: a deflected enemy knocks an untouched one
      if(j>10&&a.hit!==b.hit){
        (a.hit?b:a).hit=true;score+=2;
        pops.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,txt:"+2 chain",life:1.2});
        burst((a.x+b.x)/2,(a.y+b.y)/2,10,"#ffd166",180);
      }
    }
  }

  for(let i=pickups.length-1;i>=0;i--){
    const q=pickups[i];q.age+=dt;q.life-=dt;
    q.x=cl(q.x+q.vx*dt,14,W-14);q.y=cl(q.y+q.vy*dt,14,H-14);
    const f2=Math.exp(-2*dt);q.vx*=f2;q.vy*=f2;
    let got=false;
    if(!over&&q.age>.5)got=Math.hypot(q.x-P.x,q.y-P.y)<R+11||segPoint(p0x,p0y,p1x,p1y,q.x,q.y)[0]<11+T;
    if(got){
      if(q.type===6)P.hp=Math.min(P.maxhp,P.hp+1);
      else if(q.type===7){if(P.maxhp<8){P.maxhp++;P.hp++}else P.hp=P.maxhp;}
      else cnt[q.type]=Math.min(q.type===4?3:12,cnt[q.type]+1); // powerups are permanent and stack
      burst(q.x,q.y,18,TYPES[q.type].c,160);
    }
    if(got||q.life<=0)pickups.splice(i,1);
  }
  for(const q of pops){q.y-=30*dt;q.life-=dt;}
  pops=pops.filter(q=>q.life>0);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
}

/* ---------- drawing ---------- */
function drawIcon(type,x,y,r){
  const col=TYPES[type].c;
  ctx.save();ctx.translate(x,y);ctx.scale(r/11,r/11);
  ctx.fillStyle=col+"33";ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.arc(0,0,11,0,6.283);ctx.fill();ctx.stroke();
  ctx.lineWidth=1.6;ctx.beginPath();
  if(type===0){ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.moveTo(-7,0);ctx.lineTo(-3,-3);ctx.moveTo(-7,0);ctx.lineTo(-3,3);ctx.moveTo(7,0);ctx.lineTo(3,-3);ctx.moveTo(7,0);ctx.lineTo(3,3);}
  else if(type===1){ctx.moveTo(2,-7);ctx.lineTo(-3,1);ctx.lineTo(1,1);ctx.lineTo(-2,7);ctx.lineTo(3,-1);ctx.lineTo(-1,-1);ctx.closePath();}
  else if(type===2){ctx.moveTo(-6,-5);ctx.lineTo(-1,0);ctx.lineTo(-6,5);ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);}
  else if(type===3){ctx.moveTo(-5,5);ctx.lineTo(5,5);ctx.lineTo(3,-2);ctx.lineTo(-3,-2);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.moveTo(-2,-2);ctx.arc(0,-4,2.2,Math.PI,0);}
  else if(type===7){ctx.moveTo(0,6);ctx.bezierCurveTo(-10,-1,-6,-8,0,-3);ctx.bezierCurveTo(6,-8,10,-1,0,6);ctx.fillStyle=col;ctx.fill();}
  else if(type===6){ctx.lineWidth=3;ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.moveTo(-6,0);ctx.lineTo(6,0);}
  else if(type===5){ctx.arc(0,0,3.5,0,6.283);ctx.moveTo(-9,0);ctx.lineTo(-6,0);ctx.moveTo(9,0);ctx.lineTo(6,0);ctx.moveTo(0,-9);ctx.lineTo(0,-6);ctx.moveTo(0,9);ctx.lineTo(0,6);}
  else{ctx.moveTo(0,-7);ctx.lineTo(6,-4);ctx.lineTo(5,3);ctx.lineTo(0,7);ctx.lineTo(-5,3);ctx.lineTo(-6,-4);ctx.closePath();}
  ctx.stroke();ctx.restore();
}
function drawEnemy(e){
  const r=e.r,l=e.hit?72:58;
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);ctx.lineCap="round";ctx.lineJoin="round";
  for(let i=0;i<e.ant;i++){ // antennae with glowing bulbs
    const sx=(i-(e.ant-1)/2)*r*.7,ex=sx*1.9;
    ctx.strokeStyle=`hsl(${e.hue},60%,${l-12}%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sx,-r*.7);ctx.lineTo(ex,-r*1.75);ctx.stroke();
    ctx.fillStyle=`hsl(${(e.hue+150)%360},95%,68%)`;ctx.beginPath();ctx.arc(ex,-r*1.75,Math.max(1.8,r*.18),0,6.283);ctx.fill();
  }
  ctx.fillStyle=`hsl(${e.hue},65%,${l}%)`;ctx.strokeStyle=`hsl(${e.hue},60%,${l-25}%)`;ctx.lineWidth=1.5;ctx.beginPath();
  if(e.type===0)ctx.arc(0,0,r,0,6.283);
  else{const n=e.type===1?3:4;for(let i=0;i<n;i++){const a=i/n*6.283;ctx.lineTo(Math.cos(a)*r*1.15,Math.sin(a)*r*1.15);}ctx.closePath();}
  ctx.fill();ctx.stroke();
  const er=r*(e.eyes===1?.4:e.eyes===2?.28:.22);
  for(let i=0;i<e.eyes;i++){ // big eyes with slit pupils
    const ex=(i-(e.eyes-1)/2)*r*.55,ey=-r*.15;
    ctx.fillStyle="#f4ffe8";ctx.beginPath();ctx.ellipse(ex,ey,er,er*1.15,0,0,6.283);ctx.fill();
    ctx.fillStyle="#101010";ctx.beginPath();ctx.ellipse(ex,ey,er*.3,er*.95,0,0,6.283);ctx.fill();
  }
  if(r>11){ctx.strokeStyle="#101010";ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-r*.4,r*.38);for(let i=1;i<=4;i++)ctx.lineTo(-r*.4+i*r*.2,r*(i%2?.55:.38));ctx.stroke();}
  ctx.restore();
}
function drawSaber(x,y,r,a,L,col,w){ // laser sword: dark hilt + glowing blade
  const c=Math.cos(a),s=Math.sin(a),h=r+9,seg=(d0,d1)=>{ctx.beginPath();ctx.moveTo(x+c*d0,y+s*d0);ctx.lineTo(x+c*d1,y+s*d1);ctx.stroke();};
  const ga=ctx.globalAlpha;ctx.lineCap="round";
  ctx.strokeStyle=col;ctx.globalAlpha=ga*.18;ctx.lineWidth=w+10;seg(h,r+L);
  ctx.globalAlpha=ga*.45;ctx.lineWidth=w+4;seg(h,r+L);
  ctx.globalAlpha=ga;ctx.strokeStyle="#ffffff";ctx.lineWidth=Math.max(1.5,w-2);seg(h,r+L);
  ctx.strokeStyle="#4a4f5c";ctx.lineWidth=5;seg(r,h);
  ctx.strokeStyle="#c9ccd6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+c*h-s*5,y+s*h+c*5);ctx.lineTo(x+c*h+s*5,y+s*h-c*5);ctx.stroke();
}
function drawArm(x,y,hx,hy,s,col){
  ctx.lineCap="round";ctx.strokeStyle=col;ctx.lineWidth=4.5*s;ctx.beginPath();ctx.moveTo(x,y+2*s);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.fillStyle="#8b93a7";ctx.beginPath();ctx.arc(hx,hy,3.4*s,0,6.283);ctx.fill();
}
function drawSpaceman(x,y,s,pal,evil,flash){
  const suit=flash?"#ffffff":pal.suit;
  ctx.save();ctx.translate(x,y-1);ctx.scale(s,s);ctx.lineJoin="round";
  ctx.fillStyle=pal.trim;ctx.fillRect(-6,8,5,6);ctx.fillRect(1,8,5,6);              // legs
  ctx.fillStyle=pal.dark;ctx.fillRect(-7,13,6,3);ctx.fillRect(1,13,6,3);            // boots
  ctx.fillStyle=pal.trim;ctx.beginPath();ctx.ellipse(-9.5,3,2.8,4.5,.2,0,6.283);ctx.fill(); // off-hand arm
  ctx.fillStyle=suit;ctx.beginPath();ctx.ellipse(0,3,8.5,8,0,0,6.283);ctx.fill();   // torso
  ctx.fillStyle=pal.trim;ctx.fillRect(-4,1,8,5);
  ctx.fillStyle=pal.glow;ctx.fillRect(-3,2,2,2);ctx.fillRect(1,2,2,2);ctx.fillRect(-1,4,2,1);
  if(evil){ // shoulder spikes and helmet crest
    ctx.fillStyle=pal.trim;
    ctx.beginPath();ctx.moveTo(-6,-1);ctx.lineTo(-14,-6);ctx.lineTo(-9,3);ctx.fill();
    ctx.beginPath();ctx.moveTo(6,-1);ctx.lineTo(14,-6);ctx.lineTo(9,3);ctx.fill();
    ctx.beginPath();ctx.moveTo(-2,-12);ctx.lineTo(0,-17);ctx.lineTo(2,-12);ctx.fill();
  }
  ctx.fillStyle=suit;ctx.beginPath();ctx.arc(0,-6,7.5,0,6.283);ctx.fill();            // helmet
  ctx.strokeStyle=pal.trim;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=pal.visor;ctx.beginPath();ctx.ellipse(0,-6,5.3,4.2,0,0,6.283);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(-1.9,-7.5,1.8,.9,-.5,0,6.283);ctx.fill();
  if(evil){ctx.strokeStyle="#0a0a0a";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-5.5,-9.5);ctx.lineTo(0,-6.5);ctx.lineTo(5.5,-9.5);ctx.stroke();}
  ctx.restore();
}
function draw(){
  ctx.fillStyle=`hsl(${bgHue%360},38%,8%)`;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.04)";ctx.lineWidth=1;
  for(let x=0;x<=W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(const e of enemies)drawEnemy(e);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
  ctx.globalAlpha=1;
  ctx.font="700 16px system-ui,sans-serif";ctx.textAlign="center";
  for(const q of pops){ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle="#ffd166";ctx.fillText(q.txt,q.x,q.y);}
  ctx.globalAlpha=1;
  for(const q of pickups){
    if(q.life<2&&Math.floor(q.life*8)%2===0)continue;
    drawIcon(q.type,q.x,q.y,11+Math.sin(performance.now()/200)*1.2);
  }
  if(boss){
    const bc=boss.mode==="spin"?"#ff9f1c":"#ff3b3b",bs=boss.r/R0,bhx=boss.x+Math.cos(boss.th)*boss.r,bhy=boss.y+Math.sin(boss.th)*boss.r;
    drawSpaceman(boss.x,boss.y,bs,PAL_B,true,boss.cool>0&&Math.floor(boss.cool*20)%2===0);
    drawArm(boss.x,boss.y,bhx,bhy,bs,PAL_B.suit);
    drawSaber(boss.x,boss.y,boss.r,boss.th,boss.L,bc,boss.big?10:6);
    if(boss.maxhp>1){
      ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(W/2-150,58,300,10);
      ctx.fillStyle="#ff5c5c";ctx.fillRect(W/2-150,58,300*Math.max(0,boss.hp)/boss.maxhp,10);
      ctx.strokeStyle="#ffd0d0";ctx.lineWidth=1;ctx.strokeRect(W/2-150,58,300,10);
    }
  }
  if(!over){
    ctx.fillStyle="rgba(255,255,255,.07)";ctx.beginPath();ctx.moveTo(P.x,P.y);
    ctx.arc(P.x,P.y,R+P.L+8,FACE+Math.PI-GAP/2,FACE+Math.PI+GAP/2);ctx.closePath();ctx.fill();
    const pa2=FACE+P.th,phx=P.x+Math.cos(pa2)*R,phy=P.y+Math.sin(pa2)*R;
    ctx.globalAlpha=(P.inv>0&&cnt[4]<1&&Math.floor(P.inv*12)%2===0)?.35:1;
    drawSpaceman(P.x,P.y,R/R0,PAL_P,false,false);
    drawArm(P.x,P.y,phx,phy,R/R0,PAL_P.suit);
    drawSaber(P.x,P.y,R,pa2,P.L,"#5ee7ff",T*2+cnt[3]*.4);
    ctx.globalAlpha=1;
    if(cnt[4]&&(P.inv<=0||Math.floor(P.inv*10)%2===0)){ctx.strokeStyle="#c3a6ff";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(P.x,P.y,R+6,0,6.283);ctx.stroke();}
  }
  ctx.fillStyle="#e8eaee";ctx.font="600 18px system-ui,sans-serif";ctx.textAlign="left";
  ctx.fillText("Score: "+score,16,28);
  ctx.textAlign="right";ctx.fillText("Best: "+best,W-16,28);
  ctx.textAlign="left";ctx.fillStyle="#ffd166";ctx.fillText("Level "+level,16,52);
  for(let i=0;i<P.maxhp;i++){ctx.fillStyle=i<P.hp?"#ff4d4d":"rgba(255,255,255,.15)";ctx.fillRect(16+i*30,62,26,10);}
  const act=[];for(let i=0;i<6;i++)if(cnt[i])act.push(i);
  ctx.font="600 14px system-ui,sans-serif";ctx.textAlign="left";
  act.forEach((ty,i)=>{
    const x=W/2+(i-(act.length-1)/2)*70;
    drawIcon(ty,x-12,26,9);ctx.fillStyle=TYPES[ty].c;ctx.fillText("×"+cnt[ty],x+2,31);
  });
  if(dev){ctx.textAlign="left";ctx.fillStyle="#ff8a6b";ctx.font="600 13px ui-monospace,monospace";
    ctx.fillText("DEV MODE · type a level number (Enter or pause to jump) · B = spawn boss · ` = exit"+(devBuf?"   → "+devBuf:""),16,H-14);}
  ctx.textAlign="center";
  if(banner>0&&!over){
    ctx.globalAlpha=Math.min(1,banner);ctx.fillStyle="#ffd166";ctx.font="700 56px system-ui,sans-serif";ctx.fillText(bannerTxt,W/2,H/2-60);
    if(bannerSub){ctx.fillStyle="#e8eaee";ctx.font="18px system-ui,sans-serif";ctx.fillText(bannerSub,W/2,H/2-26);}
    ctx.globalAlpha=1;
  }
  if(over){
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="700 40px system-ui,sans-serif";ctx.fillText("You were hit",W/2,H/2-8);
    ctx.font="18px system-ui,sans-serif";ctx.fillText("Score "+score+" · press Space to restart",W/2,H/2+28);
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  bgHue+=((210+(level-1)*47)-bgHue)*(1-Math.exp(-2*dt));
  if(devBuf&&now-devT>800){devJump(parseInt(devBuf,10));devBuf="";}
  if(!over){
    t+=dt;spawnT-=dt;banner=Math.max(0,banner-dt);
    if(spawnT<=0){
      spawn();if(level>=3&&Math.random()<.2*(level-2))spawn();
      spawnT=Math.max(.3,(1.6-t*.012)/(1+.15*(level-1)))*(.7+Math.random()*.6)*(boss?1.8:1);
    }
    if(!boss&&score>=nextBoss)spawnBoss();
  }
  const n=6;for(let i=0;i<n;i++)step(dt/n);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
